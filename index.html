<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Le Carnet — suivi des dépenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="config.js"></script>
<style>
  :root{
    --ink: #16302B;
    --ink-soft: #234139;
    --paper: #EFE9D8;
    --paper-dim: #E4DDC8;
    --line: #C9C0A4;
    --text: #1E2A22;
    --text-dim: #5B6459;
    --clay: #C1642F;
    --teal: #3E7C74;
    --amber: #D9A441;
    --moss: #6B8F47;
    --danger: #A6402F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.05), transparent 55%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .serif{font-family:'Fraunces', serif;}
  ::selection{background:var(--amber); color:var(--ink);}

  #root{max-width:760px; margin:0 auto; padding:20px 16px 80px;}

  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:10px 2px 22px; color:var(--paper);
  }
  .brand h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:1.5rem; margin:0;
    letter-spacing:-0.01em;
  }
  .brand .sub{font-size:0.72rem; color:#A9BFB6; letter-spacing:0.06em; text-transform:uppercase; margin-top:3px;}

  .period-bar{
    background:var(--paper); border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    border:1px solid var(--line);
  }
  .period-bar button.nav{
    background:none; border:none; font-size:1.1rem; color:var(--ink-soft);
    cursor:pointer; padding:6px 10px; border-radius:8px; line-height:1;
  }
  .period-bar button.nav:hover{background:var(--paper-dim);}
  .period-label{text-align:center; flex:1;}
  .period-label .dates{font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem;}
  .period-label .days-left{font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .summary-row{display:flex; gap:10px; margin:16px 0 22px;}
  .summary-card{
    flex:1; background:var(--paper); border-radius:12px; padding:12px 14px;
    border:1px solid var(--line);
  }
  .summary-card .k{font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim);}
  .summary-card .v{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:1.15rem; margin-top:2px;}
  .summary-card.warn .v{color:var(--danger);}

  .envelope{
    position:relative;
    background:var(--paper);
    border-radius:10px;
    margin-bottom:12px;
    padding:14px 16px 16px;
    border:1px solid var(--line);
    border-left:5px solid var(--cat-color, var(--teal));
    box-shadow:0 4px 14px rgba(0,0,0,0.12);
  }
  .envelope-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .envelope-name{font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem;}
  .envelope-type{font-size:0.62rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-top:1px;}
  .envelope-nums{text-align:right;}
  .envelope-nums .spent{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:1rem;}
  .envelope-nums .of{font-size:0.72rem; color:var(--text-dim);}
  .bar-track{height:7px; background:var(--paper-dim); border-radius:4px; margin-top:10px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px; background:var(--cat-color, var(--teal)); transition:width .3s ease;}
  .bar-fill.over{background:var(--danger);}
  .envelope-footer{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .remaining{font-size:0.78rem; color:var(--text-dim);}
  .remaining.neg{color:var(--danger); font-weight:600;}
  .edit-alloc{
    background:none; border:none; color:var(--text-dim); text-decoration:underline;
    font-size:0.72rem; cursor:pointer; padding:0;
  }

  .add-btn{
    width:100%; margin-top:6px; padding:13px; border-radius:12px;
    background:var(--amber); color:var(--ink); border:none;
    font-family:'Fraunces', serif; font-weight:600; font-size:0.95rem;
    cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .add-btn:active{transform:translateY(1px);}

  .section-title{
    color:var(--paper); font-family:'Fraunces', serif; font-size:0.95rem;
    margin:26px 2px 10px; opacity:0.85;
  }

  .expense-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper); border-radius:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line);
  }
  .expense-left{display:flex; align-items:center; gap:10px;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--cat-color);}
  .expense-info .label{font-size:0.88rem; font-weight:500;}
  .expense-info .meta{font-size:0.68rem; color:var(--text-dim); margin-top:1px;}
  .expense-right{display:flex; align-items:center; gap:10px;}
  .expense-amount{font-family:'IBM Plex Mono', monospace; font-weight:600;}
  .del-btn{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:1rem; padding:2px 4px;}
  .del-btn:hover{color:var(--danger);}
  .empty-note{color:#A9BFB6; font-size:0.82rem; text-align:center; padding:16px 0; font-style:italic;}
  .expense-row{cursor:pointer;}

  .charts-row{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px;}
  .chart-card{
    flex:1; min-width:220px; background:var(--paper); border-radius:12px; padding:14px;
    border:1px solid var(--line);
  }
  .chart-card h3{font-family:'Fraunces', serif; font-size:0.9rem; margin:0 0 10px;}
  .chart-card .chart-wrap{position:relative; height:200px;}
  .chart-card .empty-note{padding:8px 0;}

  .overlay{
    position:fixed; inset:0; background:rgba(15,20,17,0.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:760px; border-radius:18px 18px 0 0;
    padding:22px 18px 26px; box-shadow:0 -10px 30px rgba(0,0,0,0.4);
    max-height:88vh; overflow-y:auto;
  }
  .sheet h2{font-family:'Fraunces', serif; margin:0 0 16px; font-size:1.15rem;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-family:'Inter', sans-serif; font-size:0.95rem; color:var(--text);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .cat-choice{display:flex; flex-wrap:wrap; gap:8px;}
  .cat-choice button{
    padding:9px 13px; border-radius:20px; border:1px solid var(--line); background:#fff;
    font-size:0.85rem; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .cat-choice button.active{background:var(--cat-color); color:#fff; border-color:transparent;}
  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn-primary{
    flex:1; padding:13px; border-radius:10px; border:none; background:var(--ink);
    color:var(--paper); font-weight:600; cursor:pointer; font-size:0.95rem;
  }
  .btn-secondary{
    padding:13px 18px; border-radius:10px; border:1px solid var(--line); background:none;
    color:var(--text-dim); cursor:pointer; font-size:0.95rem;
  }
  .alloc-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .alloc-row .name{font-size:0.9rem; display:flex; align-items:center; gap:8px;}
  .alloc-row input{width:100px; text-align:right;}

  .loading, .setup{color:var(--paper); text-align:center; padding:60px 20px; line-height:1.6;}
  .setup code{background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px;}

  @media (max-width:420px){
    .brand h1{font-size:1.25rem;}
    .summary-card .v{font-size:1rem;}
  }
</style>
</head>
<body>
<div id="root"><div class="loading serif">Chargement du carnet…</div></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const createClient = window.supabase && window.supabase.createClient;

const CAT_COLORS = { "#C1642F":"clay", "#3E7C74":"teal", "#D9A441":"amber", "#6B8F47":"moss" };

function fmt(n){
  return new Intl.NumberFormat('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}).format(n) + " €";
}

function addOneMonthMinusOneDay(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const next = new Date(d.getFullYear(), d.getMonth()+1, d.getDate());
  next.setDate(next.getDate()-1);
  return next.toISOString().slice(0,10);
}
function addOneDay(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function fmtDateLong(dateStr){
  return new Date(dateStr + "T00:00:00").toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}
function fmtDateShort(dateStr){
  return new Date(dateStr + "T00:00:00").toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
}

function App(){
  const [supabase, setSupabase] = useState(null);
  const [configError, setConfigError] = useState(false);
  const [loading, setLoading] = useState(true);
  const [categories, setCategories] = useState([]);
  const [periods, setPeriods] = useState([]);
  const [periodIndex, setPeriodIndex] = useState(0);
  const [allocations, setAllocations] = useState([]);
  const [incomes, setIncomes] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [showAddExpense, setShowAddExpense] = useState(false);
  const [editingExpense, setEditingExpense] = useState(null);
  const [showAllocEdit, setShowAllocEdit] = useState(false);
  const [showPeriodEdit, setShowPeriodEdit] = useState(false);
  const [showIncomeManage, setShowIncomeManage] = useState(false);
  const [recurringExpenses, setRecurringExpenses] = useState([]);
  const [showRecurringManage, setShowRecurringManage] = useState(false);
  const [author, setAuthor] = useState(localStorage.getItem('carnet_author') || '');

  useEffect(() => {
    if (!createClient || typeof SUPABASE_URL === 'undefined' || SUPABASE_URL.includes('TON-PROJET')) {
      setConfigError(true);
      setLoading(false);
      return;
    }
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    setSupabase(sb);
  }, []);

  useEffect(() => { if (supabase) initData(); }, [supabase]);

  async function initData(){
    setLoading(true);
    const { data: cats } = await supabase.from('categories').select('*').order('sort_order');
    setCategories(cats || []);
    const { data: recs } = await supabase.from('recurring_expenses').select('*').order('sort_order');
    setRecurringExpenses(recs || []);
    let { data: pers } = await supabase.from('periods').select('*').order('start_date');
    if (!pers || pers.length === 0) {
      pers = [await createPeriodForToday(cats, recs)];
    }
    setPeriods(pers);
    const todayIdx = findCurrentPeriodIndex(pers);
    setPeriodIndex(todayIdx);
    setLoading(false);
  }

  function findCurrentPeriodIndex(pers){
    const today = new Date().toISOString().slice(0,10);
    const idx = pers.findIndex(p => p.start_date <= today && today <= p.end_date);
    return idx >= 0 ? idx : pers.length - 1;
  }

  async function createPeriodForToday(cats, recs){
    const today = new Date();
    // Par défaut on propose le 25 du mois courant ou précédent selon la date du jour
    let startDate = new Date(today.getFullYear(), today.getMonth(), 25);
    if (today.getDate() < 25) startDate = new Date(today.getFullYear(), today.getMonth()-1, 25);
    const startStr = startDate.toISOString().slice(0,10);
    return await createPeriod(startStr, cats || categories, recs || recurringExpenses);
  }

  async function createPeriod(startStr, cats, recs){
    const endStr = addOneMonthMinusOneDay(startStr);
    const label = `${fmtDateShort(startStr)} – ${fmtDateLong(endStr)}`;
    const { data, error } = await supabase.from('periods').insert({
      start_date: startStr, end_date: endStr, label
    }).select().single();
    if (error) { console.error(error); return null; }
    const useCats = cats && cats.length ? cats : categories;
    if (useCats.length) {
      await supabase.from('period_allocations').insert(
        useCats.map(c => ({ period_id: data.id, category_id: c.id, allocated: c.default_allocated }))
      );
    }
    const useRecs = (recs && recs.length ? recs : recurringExpenses).filter(r => r.active);
    if (useRecs.length) {
      await supabase.from('expenses').insert(
        useRecs.map(r => ({ period_id: data.id, category_id: r.category_id, label: r.label, amount: r.amount, date: startStr, author: 'Auto', is_fixed: true }))
      );
    }
    return data;
  }

  const currentPeriod = periods[periodIndex];

  useEffect(() => {
    if (currentPeriod) loadPeriodData(currentPeriod.id);
  }, [currentPeriod && currentPeriod.id]);

  async function loadPeriodData(periodId){
    const { data: allocs } = await supabase.from('period_allocations').select('*').eq('period_id', periodId);
    setAllocations(allocs || []);
    const { data: incomeRows, error: incomeError } = await supabase.from('incomes').select('*').eq('period_id', periodId).order('created_at');
    if (incomeError) { console.error(incomeError); setIncomes([]); } else setIncomes(incomeRows || []);
    const { data: exps } = await supabase.from('expenses').select('*').eq('period_id', periodId).order('date', { ascending:false });
    setExpenses(exps || []);
  }

  async function goPrev(){
    if (periodIndex > 0) { setPeriodIndex(periodIndex - 1); return; }
    // créer une période antérieure
    const first = periods[0];
    const newEnd = new Date(first.start_date + "T00:00:00");
    newEnd.setDate(newEnd.getDate()-1);
    const newStart = new Date(newEnd);
    newStart.setDate(newStart.getDate() - 30);
    newStart.setDate(25);
    if (newStart >= newEnd) newStart.setMonth(newStart.getMonth()-1);
    const p = await createPeriod(newStart.toISOString().slice(0,10));
    const updated = [p, ...periods];
    setPeriods(updated);
    setPeriodIndex(0);
  }

  async function goNext(){
    if (periodIndex < periods.length - 1) { setPeriodIndex(periodIndex + 1); return; }
    const last = periods[periods.length-1];
    const newStart = addOneDay(last.end_date);
    const p = await createPeriod(newStart);
    const updated = [...periods, p];
    setPeriods(updated);
    setPeriodIndex(updated.length - 1);
  }

  function spentFor(categoryId, isFixed){
    return expenses
      .filter(e => e.category_id === categoryId && (isFixed === undefined || !!e.is_fixed === isFixed))
      .reduce((s,e) => s + Number(e.amount), 0);
  }
  function allocFor(categoryId){
    const a = allocations.find(a => a.category_id === categoryId);
    return a ? Number(a.allocated) : 0;
  }

  const totals = useMemo(() => {
    const income = incomes.reduce((s,i) => s + Number(i.amount), 0);
    const spent = expenses.reduce((s,e) => s + Number(e.amount), 0);
    const fixedSpent = expenses.filter(e => e.is_fixed).reduce((s,e) => s + Number(e.amount), 0);
    const variableSpent = spent - fixedSpent;
    return { income, spent, remaining: income - spent, fixedSpent, variableSpent };
  }, [incomes, expenses]);

  async function addIncome(payload){
    const { data, error } = await supabase.from('incomes').insert({ ...payload, period_id: currentPeriod.id }).select().single();
    if (error) { console.error(error); alert("Erreur à l'ajout du revenu : " + error.message); return; }
    setIncomes([...incomes, data]);
  }

  async function updateIncome(id, payload){
    const { data, error } = await supabase.from('incomes').update(payload).eq('id', id).select().single();
    if (error) { console.error(error); alert("Erreur à la modification du revenu : " + error.message); return; }
    setIncomes(incomes.map(i => i.id === id ? data : i));
  }

  async function deleteIncome(id){
    const { error } = await supabase.from('incomes').delete().eq('id', id);
    if (error) { console.error(error); alert("Erreur à la suppression du revenu : " + error.message); return; }
    setIncomes(incomes.filter(i => i.id !== id));
  }

  async function addExpense(payload){
    const withAuthor = { ...payload, period_id: currentPeriod.id, author };
    const { data, error } = await supabase.from('expenses').insert(withAuthor).select().single();
    if (error) { console.error(error); alert("Erreur à l'ajout : " + error.message); return; }
    setExpenses([data, ...expenses]);
    setShowAddExpense(false);
  }

  async function updateExpense(id, payload){
    const { data, error } = await supabase.from('expenses').update(payload).eq('id', id).select().single();
    if (error) { console.error(error); alert("Erreur à la modification : " + error.message); return; }
    setExpenses(expenses.map(e => e.id === id ? data : e));
    setEditingExpense(null);
  }

  async function deleteExpense(id){
    await supabase.from('expenses').delete().eq('id', id);
    setExpenses(expenses.filter(e => e.id !== id));
  }

  async function updateAllocations(newAllocs){
    for (const a of newAllocs) {
      await supabase.from('period_allocations').update({ allocated: a.allocated }).eq('id', a.id);
    }
    setAllocations(newAllocs);
    setShowAllocEdit(false);
  }

  async function updatePeriod(startStr, endStr){
    const label = `${fmtDateShort(startStr)} – ${fmtDateLong(endStr)}`;
    const { data, error } = await supabase.from('periods')
      .update({ start_date: startStr, end_date: endStr, label })
      .eq('id', currentPeriod.id).select().single();
    if (!error) {
      const updated = [...periods];
      updated[periodIndex] = data;
      updated.sort((a,b) => a.start_date.localeCompare(b.start_date));
      setPeriods(updated);
      setPeriodIndex(updated.findIndex(p => p.id === data.id));
    }
    setShowPeriodEdit(false);
  }

  async function addRecurring(payload){
    const { data, error } = await supabase.from('recurring_expenses').insert({ ...payload, active: true }).select().single();
    if (error) { console.error(error); alert("Erreur à l'ajout : " + error.message); return; }
    setRecurringExpenses([...recurringExpenses, data]);
    const { data: expense, error: expenseError } = await supabase.from('expenses').insert({
      period_id: currentPeriod.id,
      category_id: data.category_id,
      label: data.label,
      amount: data.amount,
      date: currentPeriod.start_date,
      author: 'Auto',
      is_fixed: true
    }).select().single();
    if (expenseError) {
      console.error(expenseError);
      alert("La charge récurrente est enregistrée, mais n'a pas pu être ajoutée à cette période : " + expenseError.message);
      return;
    }
    setExpenses([expense, ...expenses]);
  }

  async function updateRecurring(id, payload){
    const { data, error } = await supabase.from('recurring_expenses').update(payload).eq('id', id).select().single();
    if (error) { console.error(error); alert("Erreur à la modification : " + error.message); return; }
    setRecurringExpenses(recurringExpenses.map(r => r.id === id ? data : r));
  }

  async function deleteRecurring(id){
    const { error } = await supabase.from('recurring_expenses').delete().eq('id', id);
    if (error) { console.error(error); alert("Erreur à la suppression : " + error.message); return; }
    setRecurringExpenses(recurringExpenses.filter(r => r.id !== id));
  }

  function saveAuthor(name){
    setAuthor(name);
    localStorage.setItem('carnet_author', name);
  }

  if (configError) {
    return (
      <div className="setup">
        <h2 className="serif">Configuration requise</h2>
        <p>Ouvre <code>config.js</code> et renseigne ton <code>SUPABASE_URL</code> et ta <code>SUPABASE_ANON_KEY</code>, puis recharge la page.</p>
      </div>
    );
  }
  if (loading || !currentPeriod) {
    return <div className="loading serif">Ouverture du carnet…</div>;
  }

  const daysLeft = Math.max(0, Math.ceil((new Date(currentPeriod.end_date) - new Date()) / 86400000) + 1);

  return (
    <div>
      <div className="brand">
        <div>
          <h1>Le Carnet</h1>
          <div className="sub">Suivi des dépenses</div>
        </div>
      </div>

      <div className="period-bar">
        <button className="nav" onClick={goPrev} aria-label="Période précédente">←</button>
        <div className="period-label" onClick={() => setShowPeriodEdit(true)} style={{cursor:'pointer'}}>
          <div className="dates">{fmtDateShort(currentPeriod.start_date)} – {fmtDateLong(currentPeriod.end_date)}</div>
          <div className="days-left">{daysLeft} jour{daysLeft>1?'s':''} restant{daysLeft>1?'s':''}</div>
        </div>
        <button className="nav" onClick={goNext} aria-label="Période suivante">→</button>
      </div>

      <div className="summary-row">
        <div className="summary-card">
          <div className="k">Revenus</div>
          <div className="v mono">{fmt(totals.income)}</div>
        </div>
        <div className="summary-card">
          <div className="k">Dépensé</div>
          <div className="v mono">{fmt(totals.spent)}</div>
        </div>
        <div className={"summary-card" + (totals.remaining < 0 ? " warn" : "")}>
          <div className="k">Reste</div>
          <div className="v mono">{fmt(totals.remaining)}</div>
        </div>
      </div>

      <div className="summary-row">
        <div className="summary-card">
          <div className="k">Dont fixe</div>
          <div className="v mono">{fmt(totals.fixedSpent)}</div>
        </div>
        <div className="summary-card">
          <div className="k">Dont variable</div>
          <div className="v mono">{fmt(totals.variableSpent)}</div>
        </div>
      </div>

      <div>
        {categories.map(cat => {
          const spent = spentFor(cat.id);
          const fixedSpent = spentFor(cat.id, true);
          const variableSpent = spentFor(cat.id, false);
          return (
            <div className="envelope" key={cat.id} style={{"--cat-color": cat.color}}>
              <div className="envelope-top">
                <div>
                  <div className="envelope-name">{cat.name}</div>
                </div>
                <div className="envelope-nums">
                  <div className="spent">{fmt(spent)}</div>
                </div>
              </div>
              <div className="envelope-footer">
                <span className="remaining">
                  Fixe {fmt(fixedSpent)} · Variable {fmt(variableSpent)}
                </span>
              </div>
            </div>
          );
        })}
      </div>
      <button className="edit-alloc" style={{marginTop:'2px'}} onClick={() => setShowIncomeManage(true)}>Gérer mes revenus (salaire, aide, prime…)</button>
      <button className="edit-alloc" style={{marginTop:'6px', display:'block'}} onClick={() => setShowRecurringManage(true)}>Gérer les dépenses fixes récurrentes (loyer, électricité, internet…)</button>

      <button className="add-btn" onClick={() => setShowAddExpense(true)}>+ Ajouter une dépense</button>

      <div className="section-title">Graphiques</div>
      <Charts categories={categories} expenses={expenses} incomeTotal={totals.income} />

      <div className="section-title">Dépenses de la période</div>
      {expenses.length === 0 && <div className="empty-note">Aucune dépense enregistrée pour l'instant.</div>}
      {expenses.map(e => {
        const cat = categories.find(c => c.id === e.category_id);
        return (
          <div className="expense-row" key={e.id} onClick={() => setEditingExpense(e)}>
            <div className="expense-left">
              <div className="dot" style={{"--cat-color": cat ? cat.color : '#999', background: cat ? cat.color : '#999'}}></div>
              <div className="expense-info">
                <div className="label">{e.label}</div>
                <div className="meta">{fmtDateShort(e.date)} · {cat ? cat.name : ''} · {e.is_fixed ? 'fixe' : 'variable'}{e.author ? ' · ' + e.author : ''}</div>
              </div>
            </div>
            <div className="expense-right">
              <div className="expense-amount">{fmt(e.amount)}</div>
              <button className="del-btn" onClick={ev => { ev.stopPropagation(); deleteExpense(e.id); }} aria-label="Supprimer">✕</button>
            </div>
          </div>
        );
      })}

      {showAddExpense && (
        <AddExpenseSheet
          categories={categories}
          author={author}
          onSaveAuthor={saveAuthor}
          onClose={() => setShowAddExpense(false)}
          onSubmit={addExpense}
        />
      )}
      {editingExpense && (
        <AddExpenseSheet
          categories={categories}
          author={author}
          onSaveAuthor={saveAuthor}
          expense={editingExpense}
          onClose={() => setEditingExpense(null)}
          onSubmit={payload => updateExpense(editingExpense.id, payload)}
        />
      )}
      {showIncomeManage && (
        <IncomeManageSheet
          incomes={incomes}
          onAdd={addIncome}
          onUpdate={updateIncome}
          onDelete={deleteIncome}
          onClose={() => setShowIncomeManage(false)}
        />
      )}
      {showPeriodEdit && (
        <PeriodEditSheet
          period={currentPeriod}
          onClose={() => setShowPeriodEdit(false)}
          onSubmit={updatePeriod}
        />
      )}
      {showRecurringManage && (
        <RecurringManageSheet
          categories={categories}
          recurring={recurringExpenses}
          onAdd={addRecurring}
          onUpdate={updateRecurring}
          onDelete={deleteRecurring}
          onClose={() => setShowRecurringManage(false)}
        />
      )}
    </div>
  );
}

function AddExpenseSheet({ categories, author, onSaveAuthor, expense, onClose, onSubmit }){
  const isEdit = !!expense;
  const [categoryId, setCategoryId] = useState(expense ? expense.category_id : (categories[0] ? categories[0].id : null));
  const [label, setLabel] = useState(expense ? expense.label : '');
  const [amount, setAmount] = useState(expense ? String(expense.amount) : '');
  const [date, setDate] = useState(expense ? expense.date : new Date().toISOString().slice(0,10));
  const [isFixed, setIsFixed] = useState(expense ? !!expense.is_fixed : false);
  const [name, setName] = useState(author);

  function submit(){
    if (!categoryId || !amount || !label) return;
    onSaveAuthor(name);
    onSubmit({ category_id: categoryId, label, amount: parseFloat(String(amount).replace(',', '.')), date, is_fixed: isFixed });
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <h2>{isEdit ? 'Modifier la dépense' : 'Ajouter une dépense'}</h2>
        <div className="field">
          <label>Catégorie</label>
          <div className="cat-choice">
            {categories.map(c => (
              <button key={c.id} type="button"
                className={categoryId === c.id ? "active" : ""}
                style={{"--cat-color": c.color}}
                onClick={() => setCategoryId(c.id)}>{c.name}</button>
            ))}
          </div>
        </div>
        <div className="field">
          <label>Description</label>
          <input value={label} onChange={e => setLabel(e.target.value)} placeholder="Ex. Courses, essence, ciné…" />
        </div>
        <div className="field">
          <label>Montant (€)</label>
          <input value={amount} onChange={e => setAmount(e.target.value)} inputMode="decimal" placeholder="0,00" />
        </div>
        <div className="field">
          <label>Date</label>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} />
        </div>
        <div className="field">
          <label>Type</label>
          <div className="cat-choice">
            <button type="button" className={!isFixed ? "active" : ""} style={{"--cat-color": 'var(--teal)'}} onClick={() => setIsFixed(false)}>Variable</button>
            <button type="button" className={isFixed ? "active" : ""} style={{"--cat-color": 'var(--clay)'}} onClick={() => setIsFixed(true)}>Fixe</button>
          </div>
        </div>
        <div className="field">
          <label>Ton prénom</label>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="Pour savoir qui a dépensé quoi" />
        </div>
        <div className="sheet-actions">
          <button className="btn-secondary" onClick={onClose}>Annuler</button>
          <button className="btn-primary" onClick={submit}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

function IncomeManageSheet({ incomes, onAdd, onUpdate, onDelete, onClose }){
  const [label, setLabel] = useState('');
  const [amount, setAmount] = useState('');

  function submit(){
    const value = parseFloat(String(amount).replace(',', '.'));
    if (!label.trim() || !Number.isFinite(value) || value <= 0) {
      alert('Renseigne un libellé et un montant supérieur à zéro.');
      return;
    }
    onAdd({ label: label.trim(), amount: value });
    setLabel('');
    setAmount('');
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <h2>Revenus de la période</h2>
        {incomes.map(income => (
          <IncomeRow key={income.id} income={income} onUpdate={onUpdate} onDelete={onDelete} />
        ))}
        <div className="field" style={{marginTop:18}}>
          <label>Nouveau revenu</label>
          <input value={label} onChange={e => setLabel(e.target.value)} placeholder="Ex. Salaire, aide, prime…" style={{marginBottom:8}} />
          <input value={amount} onChange={e => setAmount(e.target.value)} inputMode="decimal" placeholder="Montant (€)" />
        </div>
        <div className="sheet-actions">
          <button className="btn-secondary" onClick={onClose}>Fermer</button>
          <button className="btn-primary" onClick={submit}>Ajouter</button>
        </div>
      </div>
    </div>
  );
}

function IncomeRow({ income, onUpdate, onDelete }){
  const [label, setLabel] = useState(income.label);
  const [amount, setAmount] = useState(String(income.amount));

  function save(){
    const value = parseFloat(String(amount).replace(',', '.'));
    if (label.trim() && Number.isFinite(value) && value > 0) {
      onUpdate(income.id, { label: label.trim(), amount: value });
    }
  }

  return (
    <div className="alloc-row">
      <input value={label} onChange={e => setLabel(e.target.value)} onBlur={save} style={{width:140, padding:'6px 8px'}} />
      <input value={amount} onChange={e => setAmount(e.target.value)} onBlur={save} inputMode="decimal" />
      <button className="del-btn" onClick={() => onDelete(income.id)} aria-label="Supprimer">✕</button>
    </div>
  );
}

function PeriodEditSheet({ period, onClose, onSubmit }){
  const [startDate, setStartDate] = useState(period.start_date);
  const [endDate, setEndDate] = useState(period.end_date);

  function submit(){
    if (!startDate || !endDate || endDate < startDate) return;
    onSubmit(startDate, endDate);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <h2>Modifier les dates de la période</h2>
        <div className="field">
          <label>Début</label>
          <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
        </div>
        <div className="field">
          <label>Fin</label>
          <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
        </div>
        <div className="sheet-actions">
          <button className="btn-secondary" onClick={onClose}>Annuler</button>
          <button className="btn-primary" onClick={submit}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

function Charts({ categories, expenses, incomeTotal }){
  const pieRef = React.useRef(null);
  const barRef = React.useRef(null);
  const pieChart = React.useRef(null);
  const barChart = React.useRef(null);

  const spentByCat = categories.map(c => expenses.filter(e => e.category_id === c.id).reduce((s,e) => s + Number(e.amount), 0));
  const hasData = spentByCat.some(v => v > 0);

  useEffect(() => {
    if (!window.Chart) return;
    try {
      if (pieChart.current) { pieChart.current.destroy(); pieChart.current = null; }
      if (hasData && pieRef.current) {
        pieChart.current = new window.Chart(pieRef.current, {
        type: 'doughnut',
        data: {
          labels: categories.map(c => c.name),
          datasets: [{ data: spentByCat, backgroundColor: categories.map(c => c.color) }]
        },
        options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }, maintainAspectRatio: false }
        });
      }
      if (barChart.current) { barChart.current.destroy(); barChart.current = null; }
      if (barRef.current) {
        barChart.current = new window.Chart(barRef.current, {
        type: 'bar',
        data: {
          labels: ['Période'],
          datasets: [
            { label: 'Revenus', data: [incomeTotal], backgroundColor: '#D9A441' },
            { label: 'Dépensé', data: [expenses.reduce((s,e) => s + Number(e.amount), 0)], backgroundColor: '#C1642F' }
          ]
        },
        options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });
      }
    } catch (error) {
      console.error('Erreur graphique:', error);
    }
    return () => {
      if (pieChart.current) pieChart.current.destroy();
      if (barChart.current) barChart.current.destroy();
    };
  }, [JSON.stringify(spentByCat), incomeTotal, expenses.length, categories.length]);

  return (
    <div className="charts-row">
      <div className="chart-card">
        <h3>Répartition des dépenses</h3>
        {hasData ? <div className="chart-wrap"><canvas ref={pieRef}></canvas></div> : <div className="empty-note">Pas encore de dépenses.</div>}
      </div>
      <div className="chart-card">
        <h3>Revenus vs dépensé</h3>
        <div className="chart-wrap"><canvas ref={barRef}></canvas></div>
      </div>
    </div>
  );
}

function RecurringManageSheet({ categories, recurring, onAdd, onUpdate, onDelete, onClose }){
  const [newCategoryId, setNewCategoryId] = useState(categories[0] ? categories[0].id : null);
  const [newLabel, setNewLabel] = useState('');
  const [newAmount, setNewAmount] = useState('');

  function submitNew(){
    const amount = parseFloat(String(newAmount).replace(',', '.'));
    if (!newCategoryId || !newLabel.trim() || !Number.isFinite(amount) || amount <= 0) {
      alert('Renseigne un libellé et un montant supérieur à zéro.');
      return;
    }
    onAdd({ category_id: newCategoryId, label: newLabel.trim(), amount });
    setNewLabel('');
    setNewAmount('');
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <h2>Dépenses fixes récurrentes</h2>
        <p style={{fontSize:'0.8rem', color:'var(--text-dim)', marginTop:-8}}>
          Elles sont ajoutées automatiquement à chaque nouvelle période (loyer, électricité, internet…).
        </p>
        {recurring.length === 0 && <div className="empty-note">Aucune dépense fixe récurrente pour l'instant.</div>}
        {recurring.map(r => (
          <RecurringRow key={r.id} recurring={r} categories={categories} onUpdate={onUpdate} onDelete={onDelete} />
        ))}
        <div className="field" style={{marginTop:18}}>
          <label>Nouvelle dépense fixe</label>
          <div className="cat-choice" style={{marginBottom:10}}>
            {categories.map(c => (
              <button key={c.id} type="button"
                className={newCategoryId === c.id ? "active" : ""}
                style={{"--cat-color": c.color}}
                onClick={() => setNewCategoryId(c.id)}>{c.name}</button>
            ))}
          </div>
          <input value={newLabel} onChange={e => setNewLabel(e.target.value)} placeholder="Ex. Loyer, EDF, Internet…" style={{marginBottom:8}} />
          <input value={newAmount} onChange={e => setNewAmount(e.target.value)} inputMode="decimal" placeholder="Montant (€)" />
        </div>
        <div className="sheet-actions">
          <button className="btn-secondary" onClick={onClose}>Fermer</button>
          <button className="btn-primary" onClick={submitNew}>Ajouter</button>
        </div>
      </div>
    </div>
  );
}

function RecurringRow({ recurring, categories, onUpdate, onDelete }){
  const [label, setLabel] = useState(recurring.label);
  const [amount, setAmount] = useState(String(recurring.amount));
  const cat = categories.find(c => c.id === recurring.category_id);

  function saveLabel(){ if (label !== recurring.label) onUpdate(recurring.id, { label }); }
  function saveAmount(){
    const val = parseFloat(String(amount).replace(',', '.')) || 0;
    if (val !== Number(recurring.amount)) onUpdate(recurring.id, { amount: val });
  }

  return (
    <div className="alloc-row">
      <div className="name">
        <span className="dot" style={{background: cat ? cat.color : '#999', width:9, height:9, borderRadius:'50%', display:'inline-block'}}></span>
        <input value={label} onChange={e => setLabel(e.target.value)} onBlur={saveLabel} style={{width:120, padding:'6px 8px'}} />
      </div>
      <input value={amount} onChange={e => setAmount(e.target.value)} onBlur={saveAmount} inputMode="decimal" />
      <button className="del-btn" onClick={() => onDelete(recurring.id)} aria-label="Supprimer">✕</button>
    </div>
  );
}

function AllocEditSheet({ categories, allocations, onClose, onSubmit }){
  const [values, setValues] = useState(
    Object.fromEntries(allocations.map(a => [a.id, a.allocated]))
  );

  function submit(){
    const updated = allocations.map(a => ({ ...a, allocated: parseFloat(String(values[a.id]).replace(',', '.')) || 0 }));
    onSubmit(updated);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <h2>Montants alloués — cette période</h2>
        {allocations.map(a => {
          const cat = categories.find(c => c.id === a.category_id);
          if (!cat) return null;
          return (
            <div className="alloc-row" key={a.id}>
              <div className="name">
                <span className="dot" style={{background: cat.color, width:9, height:9, borderRadius:'50%', display:'inline-block'}}></span>
                {cat.name}
              </div>
              <input
                value={values[a.id]}
                onChange={e => setValues({ ...values, [a.id]: e.target.value })}
                inputMode="decimal"
              />
            </div>
          );
        })}
        <div className="sheet-actions">
          <button className="btn-secondary" onClick={onClose}>Annuler</button>
          <button className="btn-primary" onClick={submit}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props){
    super(props);
    this.state = { error: null };
  }

  static getDerivedStateFromError(error){
    return { error };
  }

  render(){
    if (this.state.error) {
      return <div className="setup"><h2 className="serif">Erreur de chargement</h2><p>{this.state.error.message}</p><button className="btn-primary" onClick={() => location.reload()}>Recharger</button></div>;
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
</script>
</body>
</html>
